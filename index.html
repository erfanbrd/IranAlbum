<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ایران آلبوم | فروشگاه آلبوم‌های موسیقی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140c0a;--bg2:#1e1210;--card:#261815;--gold:#c9a24b;--gold2:#e8cf8a;--text:#f3e9d7;--mute:#b6a58b;--wine:#6b1f2a;--line:rgba(201,162,75,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6efe0;--bg2:#efe4cc;--card:#fffaf0;--gold:#8f6a1c;--gold2:#6b1f2a;--text:#2a1a14;--mute:#6f5a45;--line:rgba(143,106,28,.35);color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 60%);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.9;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 5%;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.5rem;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo span{font-size:1.6rem}
nav a{color:var(--text);text-decoration:none;margin-inline-start:18px;font-size:.95rem;opacity:.85}
nav a:hover{color:var(--gold)}
.cart{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 14px;font:inherit;cursor:pointer}
main{max-width:1100px;margin:auto;padding:0 5% 60px}
.banner{display:block;width:100%;height:auto;border-radius:0 0 16px 16px;border-bottom:2px solid var(--gold)}
.hero{text-align:center;padding:50px 0 40px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:0;color:var(--gold2);letter-spacing:1px}
.hero p{color:var(--mute);max-width:560px;margin:14px auto 26px}
.orn{color:var(--gold);letter-spacing:10px;font-size:1.1rem}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold),#a47a24);color:#1a0f0a;border:0;border-radius:6px;padding:10px 26px;font:700 1rem 'Vazirmatn',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
h2{color:var(--gold);border-inline-start:4px solid var(--gold);padding-inline-start:12px;margin:40px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;display:block;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:repeating-linear-gradient(45deg,var(--bg2),var(--bg2) 12px,var(--card) 12px,var(--card) 24px);color:var(--mute);font-size:.85rem;text-align:center}
.ph b{font-size:2.4rem;color:var(--gold)}
.ph img,.cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph{aspect-ratio:1}
.info{padding:14px 16px}
.info h3{margin:0;color:var(--gold2);font-size:1.1rem}
.info small{color:var(--mute)}
.price{color:var(--gold);font-weight:700}
.back{display:inline-block;margin:26px 0 0;color:var(--gold);text-decoration:none}
.artist{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:center;margin-top:20px}
.artist .ph{border-radius:50%;border:2px solid var(--gold);overflow:hidden}
.artist h1{margin:0;color:var(--gold2)}
.artist p{color:var(--mute);margin:8px 0 0}
.detail{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:34px;margin-top:30px}
.cover{border-radius:10px;overflow:hidden;border:1px solid var(--gold)}
.detail h1{margin:0;color:var(--gold2)}
.meta{color:var(--mute);margin:4px 0 16px}
.tracks{margin:16px 0;padding-inline-start:20px;color:var(--mute)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:0 12px;margin-inline-end:6px;font-size:.85rem;color:var(--gold)}
.cart{text-decoration:none;white-space:nowrap;font-size:.9rem}
.gen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center;color:var(--gold2);background:linear-gradient(145deg,hsl(var(--h) 40% 24%),hsl(var(--h) 50% 9%));box-shadow:inset 0 0 0 6px transparent,inset 0 0 0 7px var(--gold);font-weight:700;font-size:1.05rem;line-height:1.5}
.gen b{font-size:2.6rem;color:var(--gold);font-weight:400}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.row .ph{width:76px;border-radius:6px;overflow:hidden}
.row .gen span{display:none}.row .gen b{font-size:1.6rem}
.row h3{margin:0;color:var(--gold2);font-size:1rem}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font:inherit;cursor:pointer}
.rm{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--gold);margin-top:20px;padding-top:16px;font-size:1.2rem;color:var(--gold2)}
.wiki{display:inline-flex;align-items:center;gap:10px;margin-top:14px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:30px;padding:6px 16px 6px 8px;transition:.25s}
.wiki:hover{border-color:var(--gold);transform:translateY(-2px)}
.wiki img{width:38px;height:38px;object-fit:contain;border-radius:50%}
.sign{display:inline-flex;align-items:center;gap:12px;margin-top:16px;padding:8px 20px;border:1px solid var(--line);border-radius:40px;background:var(--card);transition:.3s}
.sign span{font-size:.8rem;color:var(--mute);letter-spacing:1px}
.sign img{height:44px;width:auto;max-width:160px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(201,162,75,.45))}
.sign:hover{border-color:var(--gold);box-shadow:0 0 22px rgba(201,162,75,.25)}
.topsign{display:flex;justify-content:center;align-items:center;padding:10px;background:linear-gradient(180deg,#000,var(--bg));border-bottom:1px solid var(--line)}
.topsign img{height:76px;width:auto;max-width:85%;object-fit:contain;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 5px rgba(201,162,75,.35))}50%{filter:drop-shadow(0 0 16px rgba(232,207,138,.9))}}
.empty{text-align:center;color:var(--mute);padding:50px 0}
.contact{max-width:1100px;margin:auto;padding:10px 5% 40px;text-align:center}
.contact h2{display:inline-block}
.contact p{color:var(--mute);margin:6px 0}
.soc{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
.soc a{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 28px;min-width:150px;transition:.25s}
.soc a:hover{border-color:var(--gold);transform:translateY(-4px)}
.soc img{width:60px;height:60px;object-fit:contain;border-radius:50%}
.tel{color:var(--gold);font-weight:700;font-size:1.2rem;text-decoration:none}
footer{text-align:center;padding:30px 5%;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#1a0f0a;padding:10px 22px;border-radius:30px;font-weight:700;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.artist,.detail{grid-template-columns:1fr}.artist .ph{max-width:180px;margin:auto}nav a{margin-inline-start:10px}}
</style>
</head>

<script>

       tracks:["آواز","تصنیف"]},
      {id:"zemestan",title:"زمستان است",fa:"Zemestan Ast",year:"",price:280000,img:"",
       desc:"آلبومی که نام خود را از شعر مشهور مهدی اخوان ثالث گرفته است. حال و هوایی غمگین، فلسفی و اجتماعی دارد و در میان دوستداران موسیقی ایرانی بسیار شناخته‌شده است.",
       tracks:["زمستان است"]},
      {id:"shab",title:"شب، سکوت، کویر",fa:"Shab, Sokoot, Kavir",year:"",price:300000,img:"",
       desc:"اثری آرام و تأمل‌برانگیز با فضایی بیابانی و عرفانی که در آن آواز شجریان با نوای ساز در هم می‌آمیزد؛ مناسب شب‌های سکوت و شنیدن ژرف.",

};

const app = document.getElementById('app');
const fmt = n => n.toLocaleString('fa-IR') + ' تومان';
let cart = {};
try{ cart = JSON.parse(localStorage.getItem('ia-cart')||'{}'); }catch(e){}
const save = () => { try{ localStorage.setItem('ia-cart', JSON.stringify(cart)); }catch(e){} document.getElementById('cnt').textContent = Object.values(cart).reduce((a,b)=>a+b,0).toLocaleString('fa-IR'); };
const find = key => { const [k,id] = key.split('/'); return {k, a:artists[k], al:artists[k].albums.find(x=>x.id===id)}; };
const addToCart = (k,id) => { const key = k+'/'+id; cart[key] = (cart[key]||0)+1; save(); };
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function cartPage(){
  const keys = Object.keys(cart).filter(k=>cart[k]>0);
  if(!keys.length){ app.innerHTML = `<h2>سبد خرید</h2><div class="empty">سبد خرید شما خالی است.<br><br><a class="btn" href="#home">دیدن آلبوم‌ها</a></div>`; return; }
  let total = 0;
  const rows = keys.map(key=>{ const {k,a,al} = find(key); const q = cart[key]; total += al.price*q;
    return `<div class="row"><a class="ph" href="#${key}">${ph(al.img,al.title)}</a>
    <div><h3>${al.title}</h3><small style="color:var(--mute)">${a.name}</small>
    <div class="qty"><button data-d="1" data-k="${key}">+</button><span>${q.toLocaleString('fa-IR')}</span><button data-d="-1" data-k="${key}">−</button></div></div>
    <div style="text-align:left"><div class="price">${fmt(al.price*q)}</div><button class="rm" data-d="0" data-k="${key}">حذف</button></div></div>`; }).join('');
  app.innerHTML = `<h2>سبد خرید</h2>${rows}<div class="total"><span>جمع کل</span><b>${fmt(total)}</b></div>
  <p style="text-align:center;margin-top:24px"><button class="btn" id="pay">ادامه و پرداخت</button></p>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const key=b.dataset.k, d=+b.dataset.d; if(d===0) delete cart[key]; else { cart[key]+=d; if(cart[key]<1) delete cart[key]; } save(); cartPage(); });
  document.getElementById('pay').onclick = () => toast('درگاه پرداخت به‌زودی فعال می‌شود');
}

const hue = s => [...s].reduce((h,c)=>(h*31+c.charCodeAt(0))%360,7);
const ph = (img, label, icon="♪") => img ? `<img src="${img}" alt="${label}">` : `<div class="gen" style="--h:${hue(label)}"><b>${icon}</b><span>${label}</span></div>`;

function albumCard(key, a){
  return `<a class="card" href="#${key}/${a.id}"><div class="ph">${ph(a.img,a.title)}</div>
  <div class="info"><h3>${a.title}</h3><small>${a.fa}${a.year ? ' · ' + a.year : ''}</small><div class="price">${fmt(a.price)}</div></div></a>`;
}

function home(){
  app.innerHTML = `
  <img class="banner" src="https://s6.uupload.ir/files/1794072793566_wag.jpg" alt="ایران آلبوم"><section class="hero"><div class="orn">♪ ♫ ♪</div><h1>ایران آلبوم</h1>
  <p>خانه‌ی آلبوم‌های ماندگار؛ از صدای جاودان شجریان تا پادشاه پاپ، مایکل جکسون.</p>
  <a class="btn" href="#shajarian">شروع گشت‌وگذار</a></section>
  <h2 id="artists-sec">خوانندگان</h2>
  <div class="grid">${Object.entries(artists).map(([k,a])=>`
    <a class="card" href="#${k}"><div class="ph">${ph(a.img,a.name,"♬")}</div>
    <div class="info"><h3>${a.name}</h3><small>${a.en} · ${a.albums.length.toLocaleString('fa-IR')} آلبوم</small></div></a>`).join('')}</div>
  <h2>آلبوم‌های برگزیده</h2>
  <div class="grid">${albumCard('mj',artists.mj.albums[1])}${albumCard('shajarian',artists.shajarian.albums[0])}${albumCard('mj',artists.mj.albums[2])}</div>`;
}

function artist(k){
  const a = artists[k];
  app.innerHTML = `<a class="back" href="#home">← بازگشت به خانه</a>
  <div class="artist"><div class="ph">${ph(a.img,a.name,"♬")}</div>
  <div><h1>${a.name}</h1><small style="color:var(--mute)">${a.en}</small><p>${a.bio}</p>
  <a class="wiki" href="${a.wiki}" target="_blank" rel="noopener" title="مشاهده در ویکی‌پدیا"><img src="https://s6.uupload.ir/files/wikipedia_logo_gold_oj5f.png" alt="ویکی‌پدیا"><span>مطالعه در ویکی‌پدیا</span></a></div></div>
  <h2>آلبوم‌ها</h2><div class="grid">${a.albums.map(x=>albumCard(k,x)).join('')}</div>`;
}

function album(k,id){
  const a = artists[k], al = a.albums.find(x=>x.id===id);
  if(!al) return home();
  app.innerHTML = `<a class="back" href="#${k}">← بازگشت به ${a.name}</a>
  <div class="detail"><div class="cover ph">${ph(al.img,al.title)}</div>
  <div><h1>${al.title}</h1>
  <div class="meta">${a.name}${al.year ? ' · ' + al.year : ''} · ${al.fa}</div>
  <p>${al.desc}</p>
  <h3 style="color:var(--gold)">برخی قطعات</h3>
  <ul class="tracks">${al.tracks.map(t=>`<li>${t}</li>`).join('')}</ul>
  <div class="price" style="font-size:1.4rem;margin-bottom:14px">${fmt(al.price)}</div>
  <button class="btn" id="add">افزودن به سبد خرید</button></div></div>`;
  document.getElementById('add').onclick = () => { addToCart(k,id); toast('به سبد خرید اضافه شد ✓'); };
}

function route(){
  const [k,id] = location.hash.replace('#','').split('/');
  if(k==='contact'){ if(!app.innerHTML.trim()) home(); document.getElementById('contact').scrollIntoView(); return; }
  if(k==='cart') cartPage(); else if(artists[k]) id ? album(k,id) : artist(k); else home();
  if(k==='artists') document.getElementById('artists-sec').scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
save(); route();
</script>
</body>
</html>
